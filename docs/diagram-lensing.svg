<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" width="780" height="430" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="ray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa0b0"/>
    </marker>
    <marker id="rayWarm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc27a"/>
    </marker>
    <linearGradient id="diskL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a3c" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#ffc27a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="diskR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffc27a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff8a3c" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect width="780" height="430" fill="#0b0d14"/>

  <text x="40" y="44" fill="#e8eaf0" font-size="22" font-weight="600" letter-spacing="-0.4">Why the disk appears above the hole</text>
  <text x="40" y="70" fill="#9aa0b0" font-size="13.5">Each pixel traces a light ray backwards through curved spacetime: d²u/dφ² + u = 3Mu², with u = 1/r.</text>

  <!-- accretion disk, edge on -->
  <rect x="120" y="243" width="140" height="7" rx="3" fill="url(#diskL)"/>
  <rect x="420" y="243" width="140" height="7" rx="3" fill="url(#diskR)"/>
  <text x="128" y="276" fill="#9aa0b0" font-size="11.5">accretion disk, edge on</text>

  <!-- photon sphere -->
  <circle cx="340" cy="246" r="62" fill="none" stroke="#4a5370" stroke-width="1.2" stroke-dasharray="4 5"/>
  <text x="340" y="172" fill="#6f768a" font-size="11" text-anchor="middle">photon sphere, r = 1.5 R</text>

  <!-- shadow -->
  <circle cx="340" cy="246" r="40" fill="#05060a" stroke="#ffd9a8" stroke-width="1.6"/>
  <text x="340" y="250" fill="#6f768a" font-size="11" text-anchor="middle">shadow</text>

  <!-- camera -->
  <rect x="690" y="232" width="34" height="26" rx="5" fill="#151824" stroke="#3f4760"/>
  <circle cx="707" cy="245" r="6" fill="#3f4760"/>
  <text x="707" y="280" fill="#9aa0b0" font-size="11.5" text-anchor="middle">camera</text>

  <!-- ray A: passes wide, bends a little, escapes -->
  <path d="M 690 196 C 560 188, 430 150, 300 128" fill="none" stroke="#9aa0b0" stroke-width="1.6" marker-end="url(#ray)"/>
  <text x="300" y="118" fill="#9aa0b0" font-size="11.5" text-anchor="start">escapes, slightly deflected</text>

  <!-- ray B: bends around and crosses the disk plane on the far side -->
  <path d="M 690 222 C 540 214, 420 196, 352 200 C 300 206, 262 228, 236 246" fill="none" stroke="#ffc27a" stroke-width="1.8" marker-end="url(#rayWarm)"/>
  <circle cx="236" cy="246" r="4.5" fill="#ffc27a"/>
  <text x="196" y="226" fill="#ffc27a" font-size="11.5" text-anchor="end">lands on the far side</text>
  <text x="196" y="242" fill="#ffc27a" font-size="11.5" text-anchor="end">of the disk</text>

  <!-- ray C: captured -->
  <path d="M 690 250 C 560 252, 460 256, 388 258" fill="none" stroke="#ff9d9d" stroke-width="1.6"/>
  <circle cx="380" cy="258" r="4" fill="#ff9d9d"/>
  <text x="430" y="310" fill="#ff9d9d" font-size="11.5" text-anchor="middle">captured, so this pixel is black</text>

  <text x="40" y="372" fill="#e8eaf0" font-size="13">The orange ray leaves the camera pointing above the hole, bends back down, and strikes the disk behind it.</text>
  <text x="40" y="394" fill="#9aa0b0" font-size="13">That light reaches the eye from above, so the far side of the disk is seen arching over the shadow. Nothing draws it there.</text>
</svg>
