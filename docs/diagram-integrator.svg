<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 410" width="780" height="410" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="fwd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7ee2a8"/>
    </marker>
    <marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff9d9d"/>
    </marker>
  </defs>

  <rect width="780" height="410" fill="#0b0d14"/>

  <text x="40" y="48" fill="#e8eaf0" font-size="22" font-weight="600" letter-spacing="-0.4">Why one step is three steps</text>
  <text x="40" y="74" fill="#9aa0b0" font-size="13.5">Yoshida's fourth-order method, built from a second-order one taken three times.</text>

  <!-- stage 1 -->
  <line x1="250" y1="130" x2="493" y2="130" stroke="#7ee2a8" stroke-width="2.4" marker-end="url(#fwd)"/>
  <text x="505" y="135" fill="#7ee2a8" font-size="13">w₁ · dt  =  +1.3512</text>

  <!-- stage 2 -->
  <line x1="493" y1="178" x2="187" y2="178" stroke="#ff9d9d" stroke-width="2.4" marker-end="url(#back)"/>
  <text x="505" y="183" fill="#ff9d9d" font-size="13">w₀ · dt  =  −1.7024</text>
  <text x="505" y="200" fill="#9aa0b0" font-size="11.5">backwards in time</text>

  <!-- stage 3 -->
  <line x1="187" y1="232" x2="430" y2="232" stroke="#7ee2a8" stroke-width="2.4" marker-end="url(#fwd)"/>
  <text x="505" y="237" fill="#7ee2a8" font-size="13">w₁ · dt  =  +1.3512</text>

  <!-- axis -->
  <line x1="150" y1="286" x2="640" y2="286" stroke="#3f4760" stroke-width="1.4"/>
  <line x1="250" y1="276" x2="250" y2="296" stroke="#8c93a6" stroke-width="1.6"/>
  <line x1="430" y1="276" x2="430" y2="296" stroke="#8c93a6" stroke-width="1.6"/>
  <text x="250" y="314" fill="#e8eaf0" font-size="12.5" text-anchor="middle">t</text>
  <text x="430" y="314" fill="#e8eaf0" font-size="12.5" text-anchor="middle">t + dt</text>

  <!-- net span -->
  <line x1="250" y1="336" x2="430" y2="336" stroke="#ffc27a" stroke-width="1.4" stroke-dasharray="4 4"/>
  <text x="340" y="330" fill="#ffc27a" font-size="12" text-anchor="middle">net advance: exactly dt</text>

  <text x="40" y="378" fill="#9aa0b0" font-size="13">2w₁ + w₀ = 1 exactly, which the tests assert to 1e-15. It is the cheapest possible check against a mistyped coefficient.</text>
</svg>
