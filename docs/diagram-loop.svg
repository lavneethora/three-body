<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 690" width="780" height="690" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8c93a6"/>
    </marker>
    <marker id="arrowWarm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc27a"/>
    </marker>
  </defs>

  <rect width="780" height="690" fill="#0b0d14"/>

  <text x="40" y="48" fill="#e8eaf0" font-size="22" font-weight="600" letter-spacing="-0.4">One rendered frame</text>
  <text x="40" y="74" fill="#9aa0b0" font-size="13.5">The physics loop runs many times inside a single frame.</text>

  <!-- boxes -->
  <g>
    <rect x="235" y="106" width="400" height="48" rx="12" fill="#151824" stroke="#272c3d"/>
    <text x="435" y="135" fill="#e8eaf0" font-size="14.5" text-anchor="middle">Frame begins, elapsed time clamped to 1/20 s</text>
  </g>

  <line x1="435" y1="154" x2="435" y2="180" stroke="#8c93a6" stroke-width="1.6" marker-end="url(#arrow)"/>

  <g>
    <rect x="235" y="182" width="400" height="62" rx="12" fill="#151824" stroke="#3a3322"/>
    <text x="435" y="208" fill="#ffc27a" font-size="14.5" text-anchor="middle">Choose the timestep from the state alone</text>
    <text x="435" y="230" fill="#9aa0b0" font-size="12.5" text-anchor="middle">dt = η · min over pairs of √( r / |Δa| ), clamped</text>
  </g>

  <line x1="435" y1="244" x2="435" y2="270" stroke="#8c93a6" stroke-width="1.6" marker-end="url(#arrow)"/>

  <g>
    <rect x="235" y="272" width="400" height="62" rx="12" fill="#151824" stroke="#272c3d"/>
    <text x="435" y="298" fill="#e8eaf0" font-size="14.5" text-anchor="middle">One symplectic step</text>
    <text x="435" y="320" fill="#9aa0b0" font-size="12.5" text-anchor="middle">three leapfrog stages, weights w₁ · w₀ · w₁</text>
  </g>

  <line x1="435" y1="334" x2="435" y2="360" stroke="#8c93a6" stroke-width="1.6" marker-end="url(#arrow)"/>

  <g>
    <rect x="235" y="362" width="400" height="48" rx="12" fill="#151824" stroke="#272c3d"/>
    <text x="435" y="391" fill="#e8eaf0" font-size="14.5" text-anchor="middle">Merge any bodies that now overlap</text>
  </g>

  <line x1="435" y1="410" x2="435" y2="436" stroke="#8c93a6" stroke-width="1.6" marker-end="url(#arrow)"/>

  <g>
    <rect x="235" y="438" width="400" height="62" rx="12" fill="#151824" stroke="#272c3d"/>
    <text x="435" y="464" fill="#e8eaf0" font-size="14.5" text-anchor="middle">Record a trail point and sample the outcome</text>
    <text x="435" y="486" fill="#9aa0b0" font-size="12.5" text-anchor="middle">on a simulated-time schedule, not a per-frame one</text>
  </g>

  <line x1="435" y1="500" x2="435" y2="526" stroke="#8c93a6" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- decision -->
  <g>
    <rect x="235" y="528" width="400" height="52" rx="12" fill="#121722" stroke="#3f4760"/>
    <text x="435" y="559" fill="#e8eaf0" font-size="14.5" text-anchor="middle">Time still owed, and budget left?</text>
  </g>

  <!-- loop back -->
  <path d="M 235 554 L 150 554 L 150 213 L 231 213" fill="none" stroke="#ffc27a" stroke-width="1.6" marker-end="url(#arrowWarm)"/>
  <text x="142" y="390" fill="#ffc27a" font-size="12.5" text-anchor="end" transform="rotate(-90 142 390)">yes, step again</text>

  <line x1="435" y1="580" x2="435" y2="606" stroke="#8c93a6" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="449" y="598" fill="#9aa0b0" font-size="12.5">no</text>

  <g>
    <rect x="235" y="608" width="400" height="48" rx="12" fill="#151824" stroke="#272c3d"/>
    <text x="435" y="637" fill="#e8eaf0" font-size="14.5" text-anchor="middle">Move meshes, set clip planes, draw</text>
  </g>

  <!-- side note -->
  <g>
    <rect x="652" y="182" width="106" height="62" rx="10" fill="#171310" stroke="#3a3322"/>
    <text x="705" y="206" fill="#ffc27a" font-size="11.5" text-anchor="middle">no wall clock</text>
    <text x="705" y="224" fill="#9aa0b0" font-size="11" text-anchor="middle">here, which is</text>
    <text x="705" y="238" fill="#9aa0b0" font-size="11" text-anchor="middle">why links replay</text>
  </g>
</svg>
